name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      AUTH_TEST_MODE: 'true'
      DATABASE_URL: postgresql://user:pass@localhost:5432/paydrop
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_access_secret_ci_access_secret_ci_access
      JWT_REFRESH_SECRET: ci_refresh_secret_ci_refresh_secret_ci_refr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
